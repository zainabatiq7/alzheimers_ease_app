name: alzhimers_ease
description: "A new Flutter project for Alzheimer's patients and caregivers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management & Local Storage
  provider: ^6.1.2
  shared_preferences: ^2.5.5

  # UI, Authentication & System Utilities
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1

  # Firebase Core Services (LOCKED VERSIONS FOR PRODUCTION STABILITY)
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^17.2.0

  # Machine Learning & Camera
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_translation: ^0.12.0
  camera: ^0.11.0
  path_provider: ^2.1.3
  image: ^4.3.0
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.3
  image_cropper: ^9.0.0

  # Audio & Voice Messaging
  record: ^5.2.0
  audioplayers: ^6.0.0
  speech_to_text: ^7.0.0

  # Real-Time Audio & Video Calling
  agora_rtc_engine: ^6.5.4
  agora_token_generator: ^0.0.2
  permission_handler: ^11.3.1

  # GPS Tracking & Map Navigation
  geolocator: ^13.0.1
  google_maps_flutter: ^2.12.0
  flutter_map: ^8.3.0
  latlong2: ^0.10.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/model/mobilefacenet.tflite
    - assets/icons/logo.png
    - assets/audio/calling.mp3
    - assets/audio/ringtone.mp3
    - assets/audio/splash.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/logo.png"
  android_12:
    image: "assets/icons/logo.png"
    icon_background_color: "#FFFFFF"
  fullscreen: true

dependency_overrides:
  ffi: ^2.1.2
  record_platform_interface: 1.1.0
  record_linux: 0.7.2